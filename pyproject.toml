[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-rag-quality-gate"
version = "1.0.0"
description = "Production RAG with citations on AWS Bedrock + Aurora pgvector, with automated evaluation quality gate"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Saran Alla", email = "saran@example.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "boto3>=1.34.144",
    "botocore>=1.34.144",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "PyYAML>=6.0.2",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-mock>=3.14.0",
    "moto>=5.0.11",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/saranreddy/aws-rag-quality-gate-starter"
Repository = "https://github.com/saranreddy/aws-rag-quality-gate-starter"
Issues = "https://github.com/saranreddy/aws-rag-quality-gate-starter/issues"

[tool.ruff]
line-length = 120
target-version = "py310"
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
